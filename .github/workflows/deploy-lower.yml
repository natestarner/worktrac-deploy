name: CD — Deploy to Lower Environment

on:
  push:
    branches: [lower]

jobs:
  deploy-backend-lower:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Read image tag
        id: tag
        run: echo "IMAGE_TAG=$(cat manifests/image-tag.txt)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name worktrac-backend-lower \
            --resource-group worktrac-rg \
            --image ghcr.io/${{ github.repository_owner }}/worktrac-backend:${{ steps.tag.outputs.IMAGE_TAG }} \
            --set-env-vars \
              "SPRING_DATASOURCE_URL=${{ secrets.SQL_CONNECTION_STRING_LOWER }}" \
              "SPRING_PROFILES_ACTIVE=lower" \
              "CORS_ALLOWED_ORIGINS=https://black-flower-0c9bf9d0f.7.azurestaticapps.net"

      - name: Configure GHCR pull credentials
        run: |
          az containerapp registry set \
            --name worktrac-backend-lower \
            --resource-group worktrac-rg \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GHCR_TOKEN }}

  deploy-frontend-lower:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_LOWER }}
          action: "upload"
          app_location: "frontend-build"
          skip_app_build: true

  smoke-tests:
    runs-on: ubuntu-latest
    needs: [deploy-backend-lower, deploy-frontend-lower]

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Wait for backend to start
        run: |
          echo "Waiting for container to wake up (cold start)..."
          sleep 30

      - name: Health check — backend
        run: |
          BACKEND_URL="https://worktrac-backend-lower.whitehill-3dc27bb3.eastus.azurecontainerapps.io"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/actuator/health" --max-time 60)
          if [ "$STATUS" != "200" ]; then
            echo "Backend health check failed with status $STATUS"
            exit 1
          fi
          echo "Backend is healthy"

      - name: Health check — frontend
        run: |
          FRONTEND_URL="https://black-flower-0c9bf9d0f.7.azurestaticapps.net"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" --max-time 30)
          if [ "$STATUS" != "200" ]; then
            echo "Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "Frontend is healthy"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [deploy-backend-lower, deploy-frontend-lower]

    steps:
      - name: Checkout source repo (for e2e tests)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/worktrac-source
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/e2e/package-lock.json

      - name: Install dependencies
        run: |
          cd source/e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd source/e2e
          npx playwright install chromium --with-deps

      - name: Wait for environments to stabilize
        run: sleep 45

      - name: Run E2E tests against lower environment
        run: |
          cd source/e2e
          npx playwright test
        env:
          E2E_BASE_URL: https://black-flower-0c9bf9d0f.7.azurestaticapps.net

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: source/e2e/playwright-report/
          retention-days: 14
