name: CD — Deploy to Lower Environment

on:
  push:
    branches: [lower]

# Lower is a single, shared, mutable environment (one Container App, one Azure SQL DB) --
# multiple source-repo worktrees can merge and promote to it independently, so without this,
# two deploys landing close together could run their e2e-tests jobs concurrently against the
# same lower DB, or race on which image tag actually ends up live. This only serializes RUNS;
# it does not gate on the previous run's result -- a red run's slot still releases the instant
# it finishes (pass or fail), so a failure here is never "held open" waiting for a fix, and
# nothing about this blocks source `main` from merging further. See worktrac-source's
# CLAUDE.md / .claude/commands/deploy-to-lower.md for the fix-attribution protocol this
# implies (a failure here may belong to a different, earlier-queued merge, not the one that
# triggered this specific run).
concurrency:
  group: deploy-lower
  cancel-in-progress: false

jobs:
  deploy-backend-lower:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Read image tag
        id: tag
        run: echo "IMAGE_TAG=$(cat manifests/image-tag.txt)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Must run BEFORE the image update below: if the Container App doesn't already
      # have valid GHCR pull credentials, the new revision's image pull fails silently
      # (the `containerapp update` command itself still reports success) and Azure keeps
      # serving whatever revision was previously running -- which is exactly what made
      # every backend route except /actuator/health look permanently 404, unchanged
      # across multiple deploys that each looked "successful."
      - name: Configure GHCR pull credentials
        run: |
          az containerapp registry set \
            --name worktrac-backend-lower \
            --resource-group worktrac-rg \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GHCR_TOKEN }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name worktrac-backend-lower \
            --resource-group worktrac-rg \
            --image ghcr.io/${{ github.repository_owner }}/worktrac-backend:${{ steps.tag.outputs.IMAGE_TAG }} \
            --set-env-vars \
              "SPRING_DATASOURCE_URL=${{ secrets.SQL_CONNECTION_STRING_LOWER }}" \
              "SPRING_PROFILES_ACTIVE=lower" \
              "CORS_ALLOWED_ORIGINS=https://black-flower-0c9bf9d0f.7.azurestaticapps.net,https://worktrac-dev.starnerconsulting.co,https://app.dev.huddle.fitness,capacitor://localhost" \
              "APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET_LOWER }}" \
              "ACS_EMAIL_CONNECTION_STRING=${{ secrets.ACS_EMAIL_CONNECTION_STRING_LOWER }}" \
              "ACS_EMAIL_SENDER_ADDRESS=DoNotReply@huddle.fitness" \
              "APP_EMAIL_APP_URL=https://app.dev.huddle.fitness/app/log" \
              "E2E_TEST_SUPPORT_KEY=${{ secrets.E2E_TEST_SUPPORT_KEY_LOWER }}" \
              "ADMIN_EMAILS=nate+huddleadmin@starner.co" \
              "EMAIL_DELIVERY_WEBHOOK_KEY=${{ secrets.EMAIL_DELIVERY_WEBHOOK_KEY_LOWER }}" \
              "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_LOWER }}" \
              "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_LOWER }}" \
              "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_LOWER }}" \
              "STRIPE_PRICE_MONTHLY=${{ secrets.STRIPE_PRICE_MONTHLY_LOWER }}" \
              "STRIPE_PRICE_YEARLY=${{ secrets.STRIPE_PRICE_YEARLY_LOWER }}" \
              "STRIPE_PRICE_PRO_STARTER_MONTH=${{ secrets.STRIPE_PRICE_PRO_STARTER_MONTH_LOWER }}" \
              "STRIPE_PRICE_PRO_STARTER_YEAR=${{ secrets.STRIPE_PRICE_PRO_STARTER_YEAR_LOWER }}" \
              "STRIPE_PRICE_PRO_STUDIO_MONTH=${{ secrets.STRIPE_PRICE_PRO_STUDIO_MONTH_LOWER }}" \
              "STRIPE_PRICE_PRO_STUDIO_YEAR=${{ secrets.STRIPE_PRICE_PRO_STUDIO_YEAR_LOWER }}" \
              "STRIPE_PRICE_PRO_PRACTICE_MONTH=${{ secrets.STRIPE_PRICE_PRO_PRACTICE_MONTH_LOWER }}" \
              "STRIPE_PRICE_PRO_PRACTICE_YEAR=${{ secrets.STRIPE_PRICE_PRO_PRACTICE_YEAR_LOWER }}" \
              "STRIPE_PRICE_PRO_UNLIMITED_MONTH=${{ secrets.STRIPE_PRICE_PRO_UNLIMITED_MONTH_LOWER }}" \
              "STRIPE_PRICE_PRO_UNLIMITED_YEAR=${{ secrets.STRIPE_PRICE_PRO_UNLIMITED_YEAR_LOWER }}" \
              "STRIPE_RETURN_URL=https://app.dev.huddle.fitness/app/billing" \
              "NATIVE_APP_STORE_URL=https://apps.apple.com/us/app/huddle-workout-tracker/id6826555272" \
              "COMPED_EMAILS=${{ secrets.COMPED_EMAILS }}"

  deploy-frontend-lower:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Apply environment frontend config
        run: cp config/lower/frontend-env.json frontend-build/config.json

      # index.html's share tags say __APP_ORIGIN__; link previews read the raw HTML, so they can't
      # come from config.json. The same step runs in deploy-prod.yml.
      - name: Fill this environment's origins
        uses: ./.github/actions/site-origins
        with:
          mode: fill
          environment: lower
          directory: frontend-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_LOWER }}
          action: "upload"
          app_location: "frontend-build"
          skip_app_build: true

      - name: Check the live app names only this environment
        uses: ./.github/actions/site-origins
        with:
          mode: verify
          environment: lower
          origin-key: APP_ORIGIN
          paths: "/"

  # The marketing site (huddle.fitness / dev.huddle.fitness) is its own free-tier Static Web
  # App, deployed independently of the main app -- so this job is deliberately NOT in anything
  # else's `needs:`, and nothing needs it. A marketing deploy failure must never hold up or be
  # held up by the app's backend/frontend/e2e jobs above.
  deploy-marketing-lower:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Apply environment robots.txt
        run: cp config/lower/marketing-robots.txt marketing-build/robots.txt

      # Every absolute URL on the site (canonical, share image, CTAs, sitemap) and its robots meta are
      # placeholders, so dev.huddle.fitness names only lower. The same step runs in deploy-prod.yml.
      - name: Fill this environment's origins
        uses: ./.github/actions/site-origins
        with:
          mode: fill
          environment: lower
          directory: marketing-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_MARKETING_LOWER }}
          action: "upload"
          app_location: "marketing-build"
          skip_app_build: true

      # What a link preview gets: each live page names only lower, and its share image is an image.
      - name: Check the live pages name only this environment
        uses: ./.github/actions/site-origins
        with:
          mode: verify
          environment: lower
          paths: "/ /for-trainers.html /pricing.html /privacy.html /terms.html /support.html"

  smoke-tests:
    runs-on: ubuntu-latest
    needs: [deploy-backend-lower, deploy-frontend-lower]

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Health check — backend
        uses: ./.github/actions/wait-for-url
        with:
          url: https://worktrac-backend-lower.whitehill-3dc27bb3.eastus.azurecontainerapps.io/actuator/health
          label: Backend
          timeout-seconds: '180'

      - name: Health check — frontend
        uses: ./.github/actions/wait-for-url
        with:
          url: https://black-flower-0c9bf9d0f.7.azurestaticapps.net
          label: Frontend
          timeout-seconds: '120'

  # The per-merge e2e gate: only the tests tagged @critical (worktrac-source e2e-tests.md,
  # "Tiers"). The WHOLE suite already ran before the merge (locally, /deploy-to-lower step 3) and
  # runs again on lower every night, in Chrome and WebKit (worktrac-source
  # .github/workflows/lower-e2e-nightly.yml). What this job adds is the real environment -- Azure
  # latency, cold starts, the production build, the real email send -- on what must never break.
  #
  # Two shards x E2E_WORKERS=4: the same 8 concurrent workers against lower's one backend as the
  # single 8-worker job it replaced, on twice the runner CPU, plus `e2e-changed`'s 4 beside them;
  # E2E_LOAD_WORKERS=12 keeps each test's time budget sized for that total load
  # (playwright.config.ts). `e2e-tests` below merges the shards and is the gate for both.
  #
  # Checks out worktrac-source's default branch, unpinned (as before), so the specs and the
  # @critical tags are main's. A --grep that matches nothing fails the run ("No tests found"), so
  # the gate can't silently become empty.
  e2e-critical:
    runs-on: ubuntu-latest
    needs: [deploy-backend-lower, deploy-frontend-lower]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout source repo (for e2e tests)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/worktrac-source
          path: source

      - name: Checkout deploy repo (for the wait-for-url action)
        uses: actions/checkout@v7
        with:
          path: deploy

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/e2e/package-lock.json

      - name: Install dependencies
        run: |
          cd source/e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd source/e2e
          npx playwright install chromium --with-deps

      - name: Wait for backend to be ready
        uses: ./deploy/.github/actions/wait-for-url
        with:
          url: https://worktrac-backend-lower.whitehill-3dc27bb3.eastus.azurecontainerapps.io/actuator/health
          label: Backend
          timeout-seconds: '180'

      - name: Wait for frontend to be ready
        uses: ./deploy/.github/actions/wait-for-url
        with:
          url: https://black-flower-0c9bf9d0f.7.azurestaticapps.net
          label: Frontend
          timeout-seconds: '120'

      # The wait-for-url checks above only prove ONE request has succeeded -- lower's Container
      # App runs min-replicas=0 (kept that way deliberately for cost; see worktrac-source's
      # CLAUDE.md), so Azure's autoscaler can still decide to scale out from that first request
      # or the traffic immediately following it. If that scale-out happens mid-suite instead of
      # here, a request can land on a different, colder instance than a previous one in the same
      # test -- e.g. TestCodeCache is in-memory and per-instance, which is exactly what caused an
      # intermittent "pending code not found" flake against lower (see e2e/tests/support/auth.ts's
      # retry-loop comment). A small burst of requests here gives that scaling decision a safe,
      # inconsequential window to settle in before Playwright's real assertions start, instead of
      # absorbing it as a flake partway through the first few specs.
      - name: Warm up backend (settle any autoscale event before real e2e traffic starts)
        run: |
          for i in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://worktrac-backend-lower.whitehill-3dc27bb3.eastus.azurecontainerapps.io/actuator/health || echo "000")
            echo "warm-up ping $i: $code"
            sleep 2
          done

      - name: Run @critical E2E tests against lower environment (shard ${{ matrix.shard }}/2)
        run: |
          cd source/e2e
          npx playwright test --grep @critical --shard=${{ matrix.shard }}/2
        env:
          E2E_BASE_URL: https://black-flower-0c9bf9d0f.7.azurestaticapps.net
          E2E_TEST_SUPPORT_KEY: ${{ secrets.E2E_TEST_SUPPORT_KEY_LOWER }}
          E2E_WORKERS: '4'
          E2E_LOAD_WORKERS: '12'
          E2E_BLOB: '1'

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: source/e2e/blob-report/
          retention-days: 1

  # New and changed tests, proven against the real environment on their FIRST deploy: every test in a
  # spec that changed since the last GREEN lower deploy, or that imports a file that changed
  # (worktrac-source scripts/select-changed-e2e.sh, which uses Playwright's own --only-changed).
  # Beside the @critical shards, not after them, and part of the same gate.
  #
  # Burn-in: a small selection runs each test 3 times, because a new test that passes once can still
  # be flaky. Retries stay on (lower's runners and cold starts are noisy), so a burn-in flake does
  # not block the deploy -- it is surfaced as a warning on the run instead, naming the test, so it is
  # fixed before it becomes nightly noise. Only a test that fails every attempt turns the deploy red.
  #
  # E2E_LOAD_WORKERS=12 on all three e2e jobs: 2 shards x 4 + these 4 run against the one backend
  # at once, and the time budgets should match that total (playwright.config.ts).
  e2e-changed:
    runs-on: ubuntu-latest
    needs: [deploy-backend-lower, deploy-frontend-lower]
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source repo (full history -- the comparison needs the last green deploy's commit)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/worktrac-source
          path: source
          fetch-depth: 0

      - name: Checkout deploy repo (for the wait-for-url action)
        uses: actions/checkout@v7
        with:
          path: deploy

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/e2e/package-lock.json

      - name: Install dependencies
        run: |
          cd source/e2e
          npm ci

      - name: Which tests are new or changed since the last green deploy?
        id: select
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/select-changed-e2e.sh "${{ github.repository }}" "${{ github.run_id }}"

      - name: Install Playwright browsers
        if: steps.select.outputs.count != '0'
        run: |
          cd source/e2e
          npx playwright install chromium --with-deps

      - name: Wait for backend to be ready
        if: steps.select.outputs.count != '0'
        uses: ./deploy/.github/actions/wait-for-url
        with:
          url: https://worktrac-backend-lower.whitehill-3dc27bb3.eastus.azurecontainerapps.io/actuator/health
          label: Backend
          timeout-seconds: '180'

      - name: Wait for frontend to be ready
        if: steps.select.outputs.count != '0'
        uses: ./deploy/.github/actions/wait-for-url
        with:
          url: https://black-flower-0c9bf9d0f.7.azurestaticapps.net
          label: Frontend
          timeout-seconds: '120'

      - name: Run new and changed E2E tests against lower (${{ steps.select.outputs.count }} tests x ${{ steps.select.outputs.repeats }})
        if: steps.select.outputs.count != '0'
        run: |
          cd source/e2e
          npx playwright test --only-changed=${{ steps.select.outputs.base }} --repeat-each=${{ steps.select.outputs.repeats }}
        env:
          E2E_BASE_URL: https://black-flower-0c9bf9d0f.7.azurestaticapps.net
          E2E_TEST_SUPPORT_KEY: ${{ secrets.E2E_TEST_SUPPORT_KEY_LOWER }}
          E2E_WORKERS: '4'
          E2E_LOAD_WORKERS: '12'

      - name: Warn on any new or changed test that flaked during burn-in
        if: ${{ !cancelled() && steps.select.outputs.count != '0' }}
        continue-on-error: true
        run: |
          cd source/e2e
          node -e '
            const r = require("./test-results/results.json");
            const flaky = new Set();
            const walk = (s, file) => {
              for (const sp of s.specs || []) for (const t of sp.tests)
                if (t.status === "flaky") flaky.add(`${sp.file || file} :: ${sp.title}`);
              (s.suites || []).forEach((c) => walk(c, s.file || file));
            };
            r.suites.forEach((s) => walk(s, s.file));
            for (const t of flaky) console.log(`::warning title=New or changed test flaked during burn-in::${t}`);
            if (!flaky.size) console.log("No new or changed test flaked.");
          '

      - name: Summarize e2e results (flaky + failed)
        if: ${{ !cancelled() && steps.select.outputs.count != '0' }}
        continue-on-error: true
        run: |
          node source/e2e/scripts/flake-summary.mjs \
            source/e2e/test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report (new and changed)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.select.outputs.count != '0' }}
        with:
          name: playwright-report-changed
          path: source/e2e/playwright-report/
          retention-days: 90

      - name: Upload machine-readable e2e results (new and changed)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.select.outputs.count != '0' }}
        with:
          name: e2e-results-json-changed
          path: source/e2e/test-results/results.json
          retention-days: 90

  # Joins the shards into the same two artifacts a single run produced -- `playwright-report` and
  # `e2e-results-json` -- so nothing that reads a lower run can tell it was sharded, and gates on
  # the shards' result. Runs whatever they concluded (a red run still gets its report), but not
  # when the deploy itself never happened.
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [e2e-critical, e2e-changed]
    if: ${{ !cancelled() && needs.e2e-critical.result != 'skipped' }}

    steps:
      - name: Checkout source repo (merge config + flake summary)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/worktrac-source
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/e2e/package-lock.json

      - name: Install dependencies
        run: |
          cd source/e2e
          npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-?
          path: source/e2e/all-blob-reports
          merge-multiple: true

      - name: Merge shard reports
        run: |
          cd source/e2e
          npx playwright merge-reports --config playwright.merge.config.ts all-blob-reports

      # Playwright runs with retries: 2 here, so a test that fails and then passes is recorded
      # `flaky` while this job -- and the whole run -- still reports success. That means a green
      # check says nothing about whether the suite is healthy: reconstructing the 51 runs still
      # retained on 2026-08-14 showed 42 green runs, 38 of which contained at least one flaky
      # test, and one spec failing 38 of 51 runs that nobody had reason to notice.
      #
      # This prints the flaky/failed tests onto the run summary page so that fact is visible
      # without anyone downloading an artifact to find it. `continue-on-error` because
      # instrumentation must never be a new way for a deploy to go red.
      - name: Summarize e2e results (flaky + failed)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          node source/e2e/scripts/flake-summary.mjs \
            source/e2e/test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: source/e2e/playwright-report/
          # Was 14. The per-test flake history exists nowhere else, and 14 days meant it was
          # already gone by the time a pattern was worth investigating -- the traces needed to
          # debug a flake noticed last week had expired. 90 is the repo maximum.
          retention-days: 90

      # The machine-readable half, kept as its own artifact rather than a second `path:` on the
      # one above: upload-artifact roots the archive at the least common ancestor of its paths, so
      # adding a path here would silently relocate index.html into a subdirectory and change how
      # the report opens.
      - name: Upload machine-readable e2e results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-json
          path: source/e2e/test-results/results.json
          retention-days: 90

      # merge-reports succeeds whatever the tests did, so the verdict is the jobs'.
      - name: Gate on @critical and the new and changed tests
        if: ${{ !cancelled() }}
        run: |
          failed=0
          if [ "${{ needs.e2e-critical.result }}" != "success" ]; then
            echo "::error::@critical e2e failed on lower (shards: ${{ needs.e2e-critical.result }}) -- see the report above."
            failed=1
          fi
          if [ "${{ needs.e2e-changed.result }}" != "success" ]; then
            echo "::error::New or changed e2e tests failed on lower (${{ needs.e2e-changed.result }}) -- see the e2e-changed job and its playwright-report-changed artifact."
            failed=1
          fi
          exit $failed
