name: CD — Deploy to Production

on:
  push:
    branches: [production]

jobs:
  deploy-backend-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Read image tag
        id: tag
        run: echo "IMAGE_TAG=$(cat manifests/image-tag.txt)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Must run BEFORE the image update below -- see the identical comment in
      # deploy-lower.yml. Kept in sync for consistency even though the lower-environment
      # crash turned out to have a different root cause (missing APP_JWT_SECRET /
      # SPRING_DATASOURCE_USERNAME placeholders, not a credentials-ordering issue).
      - name: Configure GHCR pull credentials
        run: |
          az containerapp registry set \
            --name worktrac-backend-prod \
            --resource-group worktrac-rg \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GHCR_TOKEN }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name worktrac-backend-prod \
            --resource-group worktrac-rg \
            --image ghcr.io/${{ github.repository_owner }}/worktrac-backend:${{ steps.tag.outputs.IMAGE_TAG }} \
            --set-env-vars \
              "SPRING_DATASOURCE_URL=${{ secrets.SQL_CONNECTION_STRING_PROD }}" \
              "SPRING_PROFILES_ACTIVE=production" \
              "CORS_ALLOWED_ORIGINS=https://black-desert-00fee190f.7.azurestaticapps.net,https://worktrac-app.starnerconsulting.co,https://app.huddle.fitness,capacitor://localhost" \
              "APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET_PROD }}" \
              "ACS_EMAIL_CONNECTION_STRING=${{ secrets.ACS_EMAIL_CONNECTION_STRING_PROD }}" \
              "ACS_EMAIL_SENDER_ADDRESS=DoNotReply@huddle.fitness" \
              "APP_EMAIL_APP_URL=https://app.huddle.fitness/app/log" \
              "ADMIN_EMAILS=nate+huddleadmin@starner.co" \
              "EMAIL_DELIVERY_WEBHOOK_KEY=${{ secrets.EMAIL_DELIVERY_WEBHOOK_KEY_PROD }}" \
              "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_PROD }}" \
              "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }}" \
              "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}" \
              "STRIPE_PRICE_MONTHLY=${{ secrets.STRIPE_PRICE_MONTHLY_PROD }}" \
              "STRIPE_PRICE_YEARLY=${{ secrets.STRIPE_PRICE_YEARLY_PROD }}" \
              "STRIPE_PRICE_PRO_STARTER_MONTH=${{ secrets.STRIPE_PRICE_PRO_STARTER_MONTH_PROD }}" \
              "STRIPE_PRICE_PRO_STARTER_YEAR=${{ secrets.STRIPE_PRICE_PRO_STARTER_YEAR_PROD }}" \
              "STRIPE_PRICE_PRO_STUDIO_MONTH=${{ secrets.STRIPE_PRICE_PRO_STUDIO_MONTH_PROD }}" \
              "STRIPE_PRICE_PRO_STUDIO_YEAR=${{ secrets.STRIPE_PRICE_PRO_STUDIO_YEAR_PROD }}" \
              "STRIPE_PRICE_PRO_PRACTICE_MONTH=${{ secrets.STRIPE_PRICE_PRO_PRACTICE_MONTH_PROD }}" \
              "STRIPE_PRICE_PRO_PRACTICE_YEAR=${{ secrets.STRIPE_PRICE_PRO_PRACTICE_YEAR_PROD }}" \
              "STRIPE_PRICE_PRO_UNLIMITED_MONTH=${{ secrets.STRIPE_PRICE_PRO_UNLIMITED_MONTH_PROD }}" \
              "STRIPE_PRICE_PRO_UNLIMITED_YEAR=${{ secrets.STRIPE_PRICE_PRO_UNLIMITED_YEAR_PROD }}" \
              "STRIPE_RETURN_URL=https://app.huddle.fitness/app/billing" \
              "COMPED_EMAILS=${{ secrets.COMPED_EMAILS }}"

  deploy-frontend-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Apply environment frontend config
        run: cp config/production/frontend-env.json frontend-build/config.json

      # index.html's share tags say __APP_ORIGIN__; link previews read the raw HTML, so they can't
      # come from config.json. The same step runs in deploy-lower.yml.
      - name: Fill this environment's origins
        uses: ./.github/actions/site-origins
        with:
          mode: fill
          environment: production
          directory: frontend-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          action: "upload"
          app_location: "frontend-build"
          skip_app_build: true

      - name: Check the live app names only this environment
        uses: ./.github/actions/site-origins
        with:
          mode: verify
          environment: production
          origin-key: APP_ORIGIN
          paths: "/"

  # The marketing site (huddle.fitness / www.huddle.fitness) is its own free-tier Static Web
  # App, deployed independently of the main app -- so this job is deliberately NOT in anything
  # else's `needs:`, and nothing needs it. A marketing deploy failure must never hold up or be
  # held up by the app's backend/frontend jobs above.
  deploy-marketing-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Apply environment robots.txt
        run: cp config/production/marketing-robots.txt marketing-build/robots.txt

      # Every absolute URL on the site (canonical, share image, CTAs, sitemap) and its robots meta are
      # placeholders, so huddle.fitness names only production. The same step runs in deploy-lower.yml.
      - name: Fill this environment's origins
        uses: ./.github/actions/site-origins
        with:
          mode: fill
          environment: production
          directory: marketing-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_MARKETING_PROD }}
          action: "upload"
          app_location: "marketing-build"
          skip_app_build: true

      # What a link preview gets: each live page names only production, and its share image is an image.
      - name: Check the live pages name only this environment
        uses: ./.github/actions/site-origins
        with:
          mode: verify
          environment: production
          paths: "/ /for-trainers.html /pricing.html /privacy.html /terms.html /support.html"
