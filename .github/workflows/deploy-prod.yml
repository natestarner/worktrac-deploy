name: CD — Deploy to Production

on:
  push:
    branches: [production]

jobs:
  deploy-backend-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Read image tag
        id: tag
        run: echo "IMAGE_TAG=$(cat manifests/image-tag.txt)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name worktrac-backend-prod \
            --resource-group worktrac-rg \
            --image ghcr.io/${{ github.repository_owner }}/worktrac-backend:${{ steps.tag.outputs.IMAGE_TAG }} \
            --set-env-vars \
              "SPRING_DATASOURCE_URL=${{ secrets.SQL_CONNECTION_STRING_PROD }}" \
              "SPRING_PROFILES_ACTIVE=production" \
              "CORS_ALLOWED_ORIGINS=https://black-desert-00fee190f.7.azurestaticapps.net"

      - name: Configure GHCR pull credentials
        run: |
          az containerapp registry set \
            --name worktrac-backend-prod \
            --resource-group worktrac-rg \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GHCR_TOKEN }}

  deploy-frontend-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          action: "upload"
          app_location: "frontend-build"
          skip_app_build: true
