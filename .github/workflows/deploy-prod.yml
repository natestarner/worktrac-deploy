name: CD — Deploy to Production

on:
  push:
    branches: [production]

# One production deploy at a time, in order. Two pushes in quick succession (a promotion and a
# config fix) would otherwise race on which image and which env vars end up live. Never cancels a
# run in progress: a half-applied production deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Read image tag
        id: tag
        run: echo "IMAGE_TAG=$(cat manifests/image-tag.txt)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The whole Container App -- image, size, replicas, scale rule, domains and every env var --
      # comes from infra/backend.bicep + infra/prod.bicepparam, the same way deploy-lower.yml applies
      # lower.bicepparam. Anything not in those files is removed from the live app on this apply, so
      # change production settings there, not here and not in the portal.
      #
      # The GHCR pull credentials go in the same apply as the image (they're the template's registry
      # secret). They used to need a separate `az containerapp registry set` step that ran first,
      # because a revision created without valid credentials failed its image pull silently and Azure
      # kept serving the old one. Applying both together means the revision is never created without
      # them.
      #
      # Switched from `az containerapp update` on 2026-11-14. Before the switch, the Infra preview
      # what-if against the live app showed only the 19 secret env vars (which it cannot compare),
      # and compare-secret-env.py reported every one of them a match.
      - name: Deploy backend (apply Bicep)
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          COMPED_EMAILS: ${{ secrets.COMPED_EMAILS }}
          SQL_CONNECTION_STRING_PROD: ${{ secrets.SQL_CONNECTION_STRING_PROD }}
          APP_JWT_SECRET_PROD: ${{ secrets.APP_JWT_SECRET_PROD }}
          ACS_EMAIL_CONNECTION_STRING_PROD: ${{ secrets.ACS_EMAIL_CONNECTION_STRING_PROD }}
          EMAIL_DELIVERY_WEBHOOK_KEY_PROD: ${{ secrets.EMAIL_DELIVERY_WEBHOOK_KEY_PROD }}
          STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
          STRIPE_PUBLISHABLE_KEY_PROD: ${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }}
          STRIPE_WEBHOOK_SECRET_PROD: ${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
          STRIPE_PRICE_MONTHLY_PROD: ${{ secrets.STRIPE_PRICE_MONTHLY_PROD }}
          STRIPE_PRICE_YEARLY_PROD: ${{ secrets.STRIPE_PRICE_YEARLY_PROD }}
          STRIPE_PRICE_PRO_STARTER_MONTH_PROD: ${{ secrets.STRIPE_PRICE_PRO_STARTER_MONTH_PROD }}
          STRIPE_PRICE_PRO_STARTER_YEAR_PROD: ${{ secrets.STRIPE_PRICE_PRO_STARTER_YEAR_PROD }}
          STRIPE_PRICE_PRO_STUDIO_MONTH_PROD: ${{ secrets.STRIPE_PRICE_PRO_STUDIO_MONTH_PROD }}
          STRIPE_PRICE_PRO_STUDIO_YEAR_PROD: ${{ secrets.STRIPE_PRICE_PRO_STUDIO_YEAR_PROD }}
          STRIPE_PRICE_PRO_PRACTICE_MONTH_PROD: ${{ secrets.STRIPE_PRICE_PRO_PRACTICE_MONTH_PROD }}
          STRIPE_PRICE_PRO_PRACTICE_YEAR_PROD: ${{ secrets.STRIPE_PRICE_PRO_PRACTICE_YEAR_PROD }}
          STRIPE_PRICE_PRO_UNLIMITED_MONTH_PROD: ${{ secrets.STRIPE_PRICE_PRO_UNLIMITED_MONTH_PROD }}
          STRIPE_PRICE_PRO_UNLIMITED_YEAR_PROD: ${{ secrets.STRIPE_PRICE_PRO_UNLIMITED_YEAR_PROD }}
          APPLE_SIGN_IN_PRIVATE_KEY_PROD: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY_PROD }}
        run: |
          # An empty Apple key would deploy silently and only show up when Apple account deletion
          # fails to revoke. (readEnvironmentVariable already fails on an UNSET variable; this
          # catches a set-but-empty secret too.)
          if [ -z "$(printf '%s' "$APPLE_SIGN_IN_PRIVATE_KEY_PROD" | tr -d '\r\n ')" ]; then
            echo "::error::APPLE_SIGN_IN_PRIVATE_KEY_PROD is empty; Apple account deletion could not revoke."
            exit 1
          fi

          # A record of what this apply changes: setting paths only, never values. A normal deploy
          # shows the image plus the secret env vars (what-if can't compare secrets).
          az deployment group what-if \
            --resource-group worktrac-rg \
            --name "backend-prod-preview-${{ github.run_id }}" \
            --parameters infra/prod.bicepparam \
            --no-pretty-print > whatif.json
          python3 tools/whatif-summary.py whatif.json
          rm -f whatif.json

          az deployment group create \
            --resource-group worktrac-rg \
            --name "backend-prod-${{ github.run_id }}" \
            --parameters infra/prod.bicepparam \
            --output none

      # The apply can return once the new revision is CREATED, not once it is serving,
      # and until it is, the old revision keeps answering /actuator/health -- so a health check alone
      # would pass against the previous build. Wait for the revision just created to be the latest
      # READY one, then check health and one real route through the public hostname. Production runs
      # 0.25 vCPU and takes ~100s to start (measured 2026-11-01), so the wait is generous.
      - name: Wait for the new revision to be ready
        run: |
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            read -r latest ready <<<"$(az containerapp show --name worktrac-backend-prod --resource-group worktrac-rg \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\n\t' '  ')"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              echo "Revision $latest is ready."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Revision $latest did not become ready within 10 minutes (latest ready: $ready)."
              exit 1
            fi
            echo "  waiting: latest=$latest ready=$ready"
            sleep 10
          done

      - name: Checkout deploy repo (for the wait-for-url action)
        uses: actions/checkout@v7

      - name: Wait for production backend health
        uses: ./.github/actions/wait-for-url
        with:
          url: https://api.huddle.fitness/actuator/health
          label: production backend
          timeout-seconds: '300'

      # One real route, not just the health endpoint: an unauthenticated /me must be refused with 401.
      # A 404 means the app's routes are not mounted; a 5xx means the app is up but broken.
      - name: Smoke test a real route
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.huddle.fitness/api/auth/me)
          echo "GET /api/auth/me (no token) -> $status"
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from an unauthenticated /api/auth/me, got $status."
            exit 1
          fi

  # After the backend, deliberately: a new frontend may call an endpoint only the new backend has
  # (the API changes additively -- api-compatibility.md -- so old frontends on a new backend are
  # fine, but not the reverse). A backend deploy that fails its checks therefore stops here.
  deploy-frontend-prod:
    needs: deploy-backend-prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Apply environment frontend config
        run: cp config/production/frontend-env.json frontend-build/config.json

      # index.html's share tags say __APP_ORIGIN__; link previews read the raw HTML, so they can't
      # come from config.json. The same step runs in deploy-lower.yml.
      - name: Fill this environment's origins
        uses: ./.github/actions/site-origins
        with:
          mode: fill
          environment: production
          directory: frontend-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          action: "upload"
          app_location: "frontend-build"
          skip_app_build: true

      - name: Check the live app names only this environment
        uses: ./.github/actions/site-origins
        with:
          mode: verify
          environment: production
          origin-key: APP_ORIGIN
          paths: "/"

  # The marketing site (huddle.fitness / www.huddle.fitness) is its own free-tier Static Web
  # App, deployed independently of the main app -- so this job is deliberately NOT in anything
  # else's `needs:`, and nothing needs it. A marketing deploy failure must never hold up or be
  # held up by the app's backend/frontend jobs above.
  deploy-marketing-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7

      - name: Apply environment robots.txt
        run: cp config/production/marketing-robots.txt marketing-build/robots.txt

      # Every absolute URL on the site (canonical, share image, CTAs, sitemap) and its robots meta are
      # placeholders, so huddle.fitness names only production. The same step runs in deploy-lower.yml.
      - name: Fill this environment's origins
        uses: ./.github/actions/site-origins
        with:
          mode: fill
          environment: production
          directory: marketing-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_MARKETING_PROD }}
          action: "upload"
          app_location: "marketing-build"
          skip_app_build: true

      # What a link preview gets: each live page names only production, and its share image is an image.
      - name: Check the live pages name only this environment
        uses: ./.github/actions/site-origins
        with:
          mode: verify
          environment: production
          paths: "/ /for-trainers.html /pricing.html /privacy.html /terms.html /support.html"
